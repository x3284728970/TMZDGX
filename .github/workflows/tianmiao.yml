name: 天喵节点自动更新

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  with:
    node-version: '22.x'
- uses: actions/setup-python@v5
  with:
    python-version: '3.12'
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - run: python3 天喵_github.py --token ${{ secrets.MY_GITHUB_TOKEN }}
